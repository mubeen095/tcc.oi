<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #050505; color: #fff; font-family: Inter, system-ui, sans-serif; }
  .wrap { position: relative; width: 1200px; height: 630px; padding: 62px 72px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px); background-size: 64px 64px; -webkit-mask-image: radial-gradient(circle at 28% 38%, #000 0%, transparent 72%); mask-image: radial-gradient(circle at 28% 38%, #000 0%, transparent 72%); }
  .glow { position: absolute; width: 660px; height: 660px; right: -170px; top: -200px; background: radial-gradient(circle, rgba(0,87,222,.5), transparent 65%); filter: blur(24px); }
  .brand { position: relative; display: flex; align-items: center; gap: 14px; font-family: "DM Mono", monospace; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.74); }
  .dot { width: 10px; height: 10px; background: #0057de; border-radius: 50%; box-shadow: 0 0 22px rgba(0,87,222,.9); }
  h1 { position: relative; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 92px; line-height: .99; letter-spacing: -.02em; margin: 0; max-width: 1000px; }
  h1 em { font-style: italic; color: #9dbdff; }
  p { position: relative; font-size: 23px; line-height: 1.42; color: rgba(255,255,255,.63); margin: 26px 0 0; max-width: 780px; }
  .foot { position: relative; display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid rgba(255,255,255,.14); padding-top: 22px; }
  .url { font-family: "DM Mono", monospace; font-size: 17px; color: rgba(255,255,255,.8); }
  .tag { font-family: "DM Mono", monospace; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #9dbdff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="brand"><span class="dot"></span>thecodingcompany</div>
    <div>
      <h1>Your dream company.<br /><em>Your highest package.</em></h1>
      <p>Practise the exact rounds 71 campus recruiters run — then follow the track from first attempt to offer.</p>
    </div>
    <div class="foot">
      <span class="url">thecodingcompany.com</span>
      <span class="tag">Placement practice · CERT+ · Placement Partner</span>
    </div>
  </div>
</body>
</html>
